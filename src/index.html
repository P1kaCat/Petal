<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://cdn.modrinth.com https://media.forgecdn.net https://mediafilez.forgecdn.net https://edge.forgecdn.net; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Petal — Minecraft, your way</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="banner.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#"><span class="flower">✿</span> petal<span class="alpha">ALPHA</span></a>
    <div class="workspace-label">YOUR MINECRAFT SPACE</div>
    <nav aria-label="Main navigation">
      <button class="nav active" data-view="discover"><span>◈</span> Discover</button>
      <button class="nav" data-view="profiles"><span>▦</span> My profiles <b id="profile-count">0</b></button>
      <button class="nav" data-view="settings"><span>⚙</span> Settings</button>
    </nav>
    <div class="sidebar-divider"></div>
    <div class="workspace-label profile-label">ACTIVE PROFILE <button id="sidebar-create" aria-label="Create a profile">＋</button></div>
    <div id="sidebar-profiles"></div>
    <div class="sidebar-bottom"><span class="status-dot"></span> Three catalogs. One universe.<small>Petal Launcher · version 0.2.0</small></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div><span class="crumb">Petal</span><span class="slash">/</span><span id="breadcrumb">Discover</span></div><button id="account-button" class="account"><span class="avatar">◡</span><span id="account-name">Connect Microsoft</span><span>↗</span></button></header>
    <main id="content"></main>
    <footer class="statusbar"><span id="status-text">Ready to explore.</span><span>MODRINTH <i class="mr-dot"></i> <span id="cf-status">CURSEFORGE · key required</span></span></footer>
  </div>
  <div id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="dismiss-notice" aria-label="Dismiss message">×</button></div>
  <dialog id="create-dialog">
    <form id="create-form">
      <div class="dialog-top"><span class="eyebrow">A FRESH START</span><button type="button" id="close-dialog" class="icon-button" aria-label="Close">×</button></div>
      <h2>Create your world.</h2><p>One profile, its mods, its saves. Everything stays together.</p>
      <label>Profile name<input id="profile-name" required maxlength="60" placeholder="My adventure" autocomplete="off"></label>
      <div class="form-row"><label>Version category<select id="version-category"><option value="release">Releases</option><option value="snapshot">Snapshots and prereleases</option><option value="old_beta">Historical beta</option><option value="old_alpha">Historical alpha</option><option value="all">All versions</option></select></label><button type="button" class="outline" id="refresh-versions">Refresh versions</button></div>
      <label>Minecraft version<input id="profile-version" list="minecraft-versions" required maxlength="100" value="1.21.1" autocomplete="off"><datalist id="minecraft-versions"></datalist></label>
      <div class="form-row"><label>Runtime<select id="profile-loader"><option value="fabric">Fabric</option></select></label><label>Loader version<select id="profile-loader-version" required></select></label></div>
      <label><input id="loader-prerelease" type="checkbox">Include prerelease loaders</label>
      <p id="metadata-status" role="status"></p>
      <p id="dialog-error" class="error-text" role="alert"></p>
      <button type="submit" class="primary wide">Create profile <span>＋</span></button>
    </form>
  </dialog>
  <script src="profile-selection.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
